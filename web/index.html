<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trame béton</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #fafafa; color: #222; }
    #etat { font-size: 1.4rem; }
    .ok { color: #1a7f37; }
    .erreur { color: #cf222e; white-space: pre-wrap; }
    pre { background: #eee; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Trame béton</h1>
  <p id="etat">Démarrage de Python dans le navigateur…</p>
  <pre id="details" hidden></pre>

  <script type="module">
    import { preparer, URL_PYODIDE } from "./pyodide_trame.mjs";

    const etat = document.getElementById("etat");
    const details = document.getElementById("details");
    const debut = performance.now();

    // la page est dans web/, les fichiers du dépôt sont un niveau au-dessus
    async function lireTexte(chemin) {
      const reponse = await fetch("../" + chemin);
      if (!reponse.ok) throw new Error(`Fichier introuvable : ${chemin}`);
      return reponse.text();
    }

    try {
      const { loadPyodide } = await import(URL_PYODIDE + "pyodide.mjs");
      const pyodide = await loadPyodide({ indexURL: URL_PYODIDE });
      const app = await preparer(pyodide, lireTexte, (m) => (etat.textContent = m));
      const resultat = JSON.parse(app.verifier());
      const secondes = ((performance.now() - debut) / 1000).toFixed(1);
      etat.textContent = `OK (chargé en ${secondes} s)`;
      etat.className = "ok";
      details.textContent = JSON.stringify(resultat, null, 2);
      details.hidden = false;
    } catch (erreur) {
      etat.textContent = "Erreur : " + erreur.message;
      etat.className = "erreur";
      console.error(erreur);
    }
  </script>
</body>
</html>
