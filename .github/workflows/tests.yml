name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # même version que Pyodide 314.0.7 (web/pyodide_trame.mjs)
          python-version: "3.14"
      - run: pip install -e ".[test,import]"
      - run: pytest -q

  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save pyodide@314.0.7
      - run: node tests/pyodide/verifier.mjs
