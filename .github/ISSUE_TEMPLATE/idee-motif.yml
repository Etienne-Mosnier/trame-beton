name: Idée de motif
description: Décris ce que tu veux changer dans le motif de ton groupe. Copilot s'en charge.
title: "Groupe ? : "
labels: ["motif"]
body:
  - type: markdown
    attributes:
      value: |
        Décris ton idée **avec des mots de designer** : ce que tu veux voir sur la palette.
        Pas besoin de parler de code. Une idée par issue.
        Après avoir créé l'issue, clique sur **Assignees** (à droite) et choisis **Copilot**.
  - type: dropdown
    id: groupe
    attributes:
      label: Ton groupe
      options: [groupe_1, groupe_2, groupe_3, groupe_4]
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Que veux-tu faire ?
      options:
        - Créer un nouveau générateur de motif (page blanche)
        - Créer une variante d'un motif existant de mon groupe
        - Modifier un motif existant de mon groupe
    validations:
      required: true
  - type: input
    id: motif
    attributes:
      label: Nom du motif
      description: |
        Un nom court, en minuscules, sans accents ni espaces (ex. spirale, reseau_cellules).
        Pour une variante, ajoute de quel motif partir (ex. « spirale_dense, à partir de spirale »).
        Pour modifier, le nom du motif tel qu'il est (ex. spirale).
      placeholder: "spirale"
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Ce que tu veux voir
      description: |
        Décris le résultat visuel : formes, rythmes, densité, où ça change…
        Pour un nouveau générateur, dis aussi comment les couches se superposent :
        chaque « série » est imprimée l'une après l'autre (2 à 5), la suivante passe par-dessus.
      placeholder: "Ex. : une spirale qui part du centre de la forme (série A), croisée par des rayons qui partent du même centre (série B)."
    validations:
      required: true
  - type: textarea
    id: reglages
    attributes:
      label: Ce que tu veux pouvoir régler dans l'aperçu
      description: Les curseurs dont tu as besoin pour chercher la bonne version.
      placeholder: "Ex. : la hauteur des vagues, la distance entre deux vagues."
  - type: textarea
    id: images
    attributes:
      label: Croquis ou images
      description: Glisse ici une photo de croquis, une capture de Grasshopper ou une référence.
  - type: textarea
    id: ingenieurs
    attributes:
      label: Remarques des étudiants ingénieurs
      description: Contraintes béton ou robot dont il faut tenir compte (facultatif).
